  * { box-sizing: border-box; margin: 0; padding: 0; }

  .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
         padding: 10px 20px; background: #16181d; color: #e6e8ee; border-bottom: 1px solid #2a2d35; }
  .bar h1 { font-size: 13px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .seg { display: flex; gap: 4px; background: #232630; padding: 3px; border-radius: 8px; }
  .seg .lab { font-size: 11px; color: #6b7280; display: flex; align-items: center; padding: 0 4px 0 8px; }
  .seg button { border: 0; background: transparent; color: #9aa1b2; font-size: 12px; padding: 5px 10px;
                border-radius: 6px; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .seg button.on { background: #3a3f4f; color: #fff; font-weight: 600; }
  .seg button.warn.on { background: #5b3040; color: #ffd9e0; }
  .canvas { min-height: calc(100vh - 56px); padding: 26px 16px 64px; transition: background .2s; }
  .col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .meta { max-width: 720px; margin: 0 auto 14px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; }
  .note { max-width: 720px; margin: 0 auto 20px; border-radius: 10px; padding: 12px 16px; font-size: 12px; line-height: 1.75; }
  .note b { font-weight: 700; }
  .swatches { max-width: 720px; margin: 30px auto 0; }
  .swatches h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
  .chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 4px 9px; border-radius: 6px; }
  .chip .sw { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .chip .warnMark { font-size: 11px; }
  @keyframes mockSpin { to { transform: rotate(360deg); } }
  @keyframes mockPulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes mockBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  svg.ic { display: block; }

function icon(name, size, color, extra) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="${extra || ''}">${P[name]}</svg>`;

/* ============ 状态与工具函数 ============ */
const state = { scheme: 'A', theme: 'ink', mode: 'light' };

const SCHEMES = {
  current: { label: '现状(问题)' },
  A: { label: '方案 A · 语义色' },
  B: { label: '方案 B · 双色调' }
};
const MODE_LABEL = { light: '浅色', dark: '深色' };

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

function ctx() {
  const t = THEMES[state.theme][state.mode];
  const c = t.c;
  const neutralIconBg = state.mode === 'light' ? c.fill : c.fillTertiary;
  const organizeHex = THEMES[state.theme].organize[state.mode];
  const organize = { text: organizeHex, bg: hexToRgba(organizeHex, state.mode === 'light' ? 0.08 : 0.15) };

  /* 块类型 → 强调色解析 */
  function accent(kind) {
    if (state.scheme === 'current') return t.block[kind] || { text: c.primary, bg: c.primaryBg };
    if (kind === 'humanInput') return { text: c.primary, bg: c.primaryBg, solid: c.primary };
    if (state.scheme === 'B' && ['plan', 'todo', 'skill'].includes(kind)) return organize;
    return { text: c.textSecondary, bg: neutralIconBg };
  }

  /* 状态色(A/B 一律语义化;current 里部分块用块色) */
  function statusPair(kind) {
    if (state.scheme === 'current') return t.block[kind] || { text: c.primary, bg: c.primaryBg };
    return { text: c.primary, bg: c.primaryBg };
  }

  return { c, t, accent, statusPair, organize, neutralIconBg };
}

/* ============ 通用组件 ============ */

function card(inner, opt, c) {
  const o = opt || {};
  return `
  <div style="border-radius:12px; background:${c.bgContainer}; border:1px solid ${o.border || c.border};
              overflow:hidden; transition:border-color .15s, box-shadow .15s;">
    ${inner}
  </div>`;
}

function iconSquare(accentPair, iconName, c) {
  const bg = accentPair.solid || accentPair.bg;
  const fg = accentPair.solid ? c.textInverse : accentPair.text;
  return `
  <div style="display:flex; align-items:center; justify-content:center; width:22px; height:22px;
              border-radius:8px; background:${bg}; color:${fg}; flex-shrink:0;">
    ${icon(iconName, 13, fg)}
  </div>`;
}

function typeBadge(text, accentPair, c) {
  /* 现状:块色徽章;A/B:中性徽章(类型靠文字+图标,不靠颜色) */
  const neutral = state.scheme !== 'current';
  const bg = neutral ? c.fillSubtle : accentPair.bg;
  const fg = neutral ? c.textTertiary : accentPair.text;
  return `<span style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
                       padding:2px 8px; border-radius:4px; background:${bg}; color:${fg};">${text}</span>`;
}

function statusPill(text, pair, dotColor, pulse) {
  return `<span style="display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:600;
                       padding:2px 8px; border-radius:9999px; background:${pair.bg}; color:${pair.text};">
            <span style="width:5px; height:5px; border-radius:50%; background:${dotColor || pair.text};
                         ${pulse ? 'animation:mockPulse 1.2s ease-in-out infinite;' : ''}"></span>${text}
          </span>`;
}

function chevron(c, color, expanded) {
  return icon('chevDown', 14, color || c.textTertiary, `transform:rotate(${expanded ? 180 : 0}deg); transition:transform .15s;`);
}

/* 头部:现状 fill 灰底;A/B 与卡身同色、更轻 */
function header({ a, title, right, expanded, c, tintBg, bottomBorder }) {
  const cur = state.scheme === 'current';
  const bg = tintBg != null ? tintBg : (cur ? c.fill : 'transparent');
  const bb = bottomBorder != null ? bottomBorder : c.borderSecondary;
  return `
  <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 16px;
              background:${bg}; ${expanded ? `border-bottom:1px solid ${bb};` : ''}">
    <div style="display:flex; align-items:center; gap:8px; min-width:0;">
      ${a}
      <span style="font-size:13px; font-weight:600; color:${c.text}; white-space:nowrap; overflow:hidden;
                   text-overflow:ellipsis;">${title}</span>
    </div>
    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
      ${right || ''}
    </div>
  </div>`;
}

function codeRow(label, dotColor, content, c) {
  return `
  <div style="display:flex; align-items:center; gap:8px; padding:8px 16px;">
    <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
      <span style="width:6px; height:6px; border-radius:50%; background:${dotColor}; flex-shrink:0;"></span>
      <span style="font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
                   color:${c.textTertiary}; width:34px;">${label}</span>
    </div>
    <span style="font-family:'SF Mono',Monaco,Consolas,monospace; font-size:12px; color:${c.textSecondary};
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;">${content}</span>
  </div>`;
}

      </div>`,
      { border: a.text }, c
    );

  /* A/B:普通卡身;身份色收敛到实心主色 icon */
  return card(
    header({
      a: iconSquare({ solid: a.solid }, 'message', c),
      title: '把 release 脚本迁移到 pnpm,并跑一遍单测',
      right: `<span style="font-size:11px; color:${c.success};">已回复</span>`,
      expanded: true, c
    }) + `

function progressBar(pct, fillColor, c) {
  return `
  <div style="height:4px; border-radius:2px; background:${c.fillSecondary}; overflow:hidden;">
    <div style="width:${pct}%; height:100%; border-radius:2px; background:${fillColor}; transition:width .3s;"></div>
  </div>`;
}

function stepRow(state_, text, activePair, c) {
  /* state_: done | running | pending */
  const box = (bg, fg, inner, border) => `
    <div style="display:flex; align-items:center; justify-content:center; width:16px; height:16px;
                border-radius:5px; background:${bg}; color:${fg}; flex-shrink:0;
                ${border ? `border:1px solid ${c.border};` : ''}">${inner}</div>`;
  let b;
  if (state_ === 'done') b = box(c.successBg, c.success, icon('checkCircle', 10, c.success));
  else if (state_ === 'running') b = box(activePair.bg, activePair.text, icon('loader', 10, activePair.text, 'animation:mockSpin .9s linear infinite;'));
  else b = box('transparent', c.textQuaternary, icon('checkCircle', 10, c.textQuaternary), true);
  const color = state_ === 'pending' ? c.textTertiary : c.text;
  return `
  <div style="display:flex; align-items:center; gap:8px; padding:5px 16px;">
    ${b}
    <span style="font-size:13px; color:${color}; ${state_ === 'running' ? 'font-weight:600;' : ''}">${text}</span>
    ${state_ === 'running' ? '<span style="font-size:11px; color:' + c.textTertiary + ';">进行中</span>' : ''}
  </div>`;
}

    ? statusPill('运行中', state.scheme === 'current' ? a : { text: c.primary, bg: c.primaryBg }, null, true)

    '<b>① 10 类块 = 10 种专色</b>,一段会话紫/蓝/青/琥珀/绿/玫红轮番上阵,视觉上没有主次。',
    '<b>② 三组撞色</b>:用户输入≈脚本工具(琥珀)、子代理==MCP 工具(青)、技能≈思考(紫)——颜色没能区分类型,反而互相打架。',
    '<b>③ 色板跨主题几乎复制粘贴</b>,与主题气质脱节(墨=单色主题、烬=暖橙,却都在开彩虹);Shell 终端更是硬编码 slate 色,完全不受主题控制。'
  ],
  A: [
    '<b>① 中性卡 + 图标辨型</b>:块类型靠图标形状与标题区分,颜色不再编码"类型",卡片全部回归主题中性面(bgContainer/border)。',
    '<b>② 颜色只表达语义</b>:用户输入 = 品牌色(身份);运行中 = 品牌色脉动;错误 = 红;完成 = 仅输出状态点。全链路只用主题已有 token。',
    '<b>③ 任何主题自动协调</b>:终端底色、徽章、进度条全部从主题派生;Error 块是唯一整卡上色的块,异常更醒目。'
  ],
  B: [
    '<b>① 在 A 的基础上保留一点"工作温度"</b>:Plan / Todo / Skill 等"模型工作产出"使用一个主题派生的工作色。',
    '<b>② 工作色取自各主题的第二主色</b>:墨→朱砂、烬→琥珀、汐→月光青、樱→紫罗兰、暖纸→靛蓝、岩蓝→紫,不再是全局一套彩虹。',
    '<b>③ 色彩总量从 10 色收敛到 2 色 + 状态色</b>,工具/子代理等过程噪音保持中性。'
  ]
};

function swatchRow() {
  const { c, organize } = ctx();
  const t = THEMES[state.theme][state.mode];
  const chip = (bg, fg, label, note) => `
    <span class="chip" style="background:${c.bgContainer}; border:1px solid ${c.border}; color:${c.textSecondary};">
      <span class="sw" style="background:${bg};"></span>${label}
      ${note ? `<span class="warnMark" style="color:${c.error};">${note}</span>` : ''}
    </span>`;
  if (state.scheme === 'current') {
    const names = { thinking: '思考', plan: '计划', toolMcp: 'MCP工具', toolScript: '脚本工具', toolBuiltin: '内置工具',
                    humanInput: '用户输入', skill: '技能', a2ui: 'A2UI', subagent: '子代理', todo: '清单' };
    const dup = { humanInput: '⚠撞色', toolScript: '⚠撞色', subagent: '⚠撞色', toolMcp: '⚠撞色', skill: '⚠撞色', thinking: '⚠撞色' };
    return Object.keys(names).map(k => chip(t.block[k].bg, t.block[k].text, names[k], dup[k])).join('');
  }
  if (state.scheme === 'A') {
    return chip(c.primaryBg, c.primary, '品牌 · 用户输入/运行中') +
           chip(c.successBg, c.success, '成功') +
           chip(c.errorBg, c.error, '错误');
  }
  return chip(c.primaryBg, c.primary, '品牌 · 用户输入') +
         chip(organize.bg, organize.text, '工作色 · 计划/清单/技能') +
         chip(c.successBg, c.success, '成功') +
         chip(c.errorBg, c.error, '错误');
}

/* ============ 渲染 ============ */

function render() {
  const { c } = ctx();
  const canvas = document.getElementById('canvas');
  canvas.style.background = c.bgBase;
  canvas.innerHTML = `
    <div class="meta" style="color:${c.textTertiary};">
      <span>会话流预览 · <b style="color:${c.textSecondary};">${THEMES[state.theme].name}</b> · ${MODE_LABEL[state.mode]}</span>
      <span>${SCHEMES[state.scheme].label}</span>
    </div>
    <div class="note" style="background:${c.bgContainer}; border:1px solid ${c.border}; color:${c.textSecondary};">
      ${NOTES[state.scheme].join('<br/>')}
    </div>
    <div class="col">
      ${humanInputBlock()}
      ${thinkingBlock()}
      ${textBlock()}
      ${planBlock()}
      ${todoBlock()}
      ${toolCallBlock('toolMcp', 'mcp__fs__read_file', false, '{ "name": "@agentskillmania/skill-ui-chat" }')}
      ${toolCallBlock('toolScript', 'run_script', true, null)}
      ${shellBlock()}
      ${skillBlock()}
      ${subAgentBlock()}
      ${a2uiBlock()}
      ${errorBlock()}
    </div>
    <div class="swatches">
      <h2 style="color:${c.textTertiary};">色板对照 · ${state.scheme === 'current' ? '10 色彩虹' : state.scheme === 'A' ? '1 色语义 + 状态' : '2 色 + 状态'}</h2>
      <div class="chiprow">${swatchRow()}</div>
    </div>`;
}

/* ============ 控制条 ============ */

function buildSeg(id, items, key, extraClassOf) {
  const seg = document.getElementById(id);
  seg.innerHTML = items.map(it =>
    `<button data-v="${it.v}" class="${state[key] === it.v ? 'on ' + (extraClassOf ? extraClassOf(it.v) : '') : ''}">${it.label}</button>`
  ).join('');
  seg.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { state[key] = btn.dataset.v; render(); buildSegs(); };
  });
}
function buildSegs() {
  buildSeg('schemeSeg', Object.entries(SCHEMES).map(([v, s]) => ({ v, label: s.label })), 'scheme', v => v === 'current' ? 'warn' : '');
  buildSeg('themeSeg', Object.entries(THEMES).map(([v, t]) => ({ v, label: t.name })), 'theme');
  buildSeg('modeSeg', [{ v: 'light', label: '☀ 浅色' }, { v: 'dark', label: '☾ 深色' }], 'mode');
}

buildSegs();
render();
</script>
</body>
</html>
