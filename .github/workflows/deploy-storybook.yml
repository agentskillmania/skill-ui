name: Deploy Storybook

# Builds every package's Storybook into its own sub-path, copies in the landing
# page, and publishes the lot to GitHub Pages.
#
# Package list here must stay in sync with the cards in storybook-pages/index.html.
# The base path prefix `/skill-ui/` matches the repo name (project page).
# If the repo is renamed or moved to a user page, update STORYBOOK_BASE_PATH below.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'storybook-pages/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid overlapping deploys; let the latest one finish.
concurrency:
  group: deploy-storybook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Build all packages first: each package.json entry points at ./dist/index.js,
      # so cross-package imports (e.g. chat → @agentskillmania/skill-ui-shared) only
      # resolve once dist/ exists. Mirrors the local pre-commit hook's `pnpm build`.
      - run: pnpm build

      - name: Build every Storybook into its sub-path
        run: |
          mkdir -p site-dist
          for pkg in chat settings portal frame shared editor; do
            echo "::group::Building packages/$pkg"
            STORYBOOK_BASE_PATH="/skill-ui/$pkg/" \
              pnpm --filter "./packages/$pkg" exec storybook build -o "$GITHUB_WORKSPACE/site-dist/$pkg"
            echo "::endgroup::"
          done

      - name: Add landing page
        run: cp storybook-pages/index.html site-dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

      - id: deploy
        uses: actions/deploy-pages@v4
